[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-framework"
version = "11.0.0"
description = "ATOMIC Web Vulnerability Scanner"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests==2.34.2",
    "beautifulsoup4==4.14.3",
    "urllib3==2.7.0",
    "sqlalchemy==2.0.50",
    "fpdf2==2.8.7",
    "PyJWT==2.13.0",
    "pysocks==1.7.1",
    "flask==3.1.3",
    "werkzeug==3.1.8",
    "jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "flask-socketio==5.6.1",
    "flask-cors==6.0.5",
    "colorama==0.4.6",
    "tqdm==4.68.3",
    "dnspython==2.8.0",
    "PyYAML==6.0.3",
    "scapy==2.7.0",
]

[project.optional-dependencies]
full = [
    "lxml>=6.0.0",
    "cryptography>=46.0.0",
    "paramiko>=4.0.0",
]
dev = [
    "pytest>=9.0.0",
    "black>=26.0.0",
    "mypy>=1.20.0",
    "flake8>=7.3.0",
]

[tool.setuptools.packages.find]
include = ["core*", "modules*", "utils*", "web*"]

[tool.bandit]
# ATOMIC is an *offensive* security tool. By design it embeds attack
# payloads (eval/exec/SQL strings), shells out to external recon tools
# via subprocess, and computes non-cryptographic content fingerprints
# with md5. Those legitimately trip Bandit's lower-severity heuristics.
#
# Rather than blanket-skipping whole test IDs (which would blind us to a
# genuine hardcoded secret or an unsafe deserialization in the tool's
# *own* code), CI gates only on HIGH severity + HIGH confidence findings
# (see .github/workflows/security.yml and ci.yml). A full lower-severity
# scan is still run and uploaded as an informational artifact. This
# section just scopes what Bandit walks.
exclude_dirs = ["tests", ".git", "build", "dist", ".venv", "venv", "node_modules"]
