[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-framework"
version = "11.0.0"
description = "ATOMIC Web Vulnerability Scanner"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "urllib3==2.7.0",
    "sqlalchemy==2.0.51",
    "fpdf2==2.8.7",
    "PyJWT==2.13.0",
    "pysocks==1.7.1",
    "flask==3.1.3",
    "werkzeug==3.1.8",
    "jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "flask-socketio==5.6.1",
    "flask-cors==6.0.5",
    "colorama==0.4.6",
    "tqdm==4.70.0",
    "dnspython==2.8.0",
    "PyYAML==6.0.3",
    "scapy==2.7.0",
]

[project.scripts]
atomic = "atomic.__main__:main"

[project.optional-dependencies]
full = [
    "lxml>=6.0.4",
    "cryptography>=46.0.0",
    "paramiko>=4.0.0",
]
dev = [
    "pytest>=9.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.0.0",
    "black>=26.0.0",
    "mypy>=1.20.0",
    "flake8>=7.3.0",
    "bandit>=1.9.0",
    "pip-audit>=2.10.0",
    "build>=1.3.0",
]

[tool.setuptools]
py-modules = ["config", "main"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["atomic*", "core*", "modules*", "utils*", "web*"]

[tool.setuptools.package-data]
web = ["templates/*.html", "static/*.css", "static/app/css/*.css", "static/app/js/*.js", "static/app/js/core/*.js", "static/app/js/views/*.js"]

[tool.pytest.ini_options]
# Registered markers keep `--strict-markers` clean and stop the
# "Unknown pytest.mark.integration" warning spam during collection.
markers = [
    "integration: end-to-end tests that spin up a live server and exercise the full scan pipeline",
]

[tool.bandit]
# ATOMIC is an *offensive* security tool. By design it embeds attack
# payloads (eval/exec/SQL strings), shells out to external recon tools
# via subprocess, and computes non-cryptographic content fingerprints
# with md5. Those legitimately trip Bandit's lower-severity heuristics.
#
# Rather than blanket-skipping whole test IDs (which would blind us to a
# genuine hardcoded secret or an unsafe deserialization in the tool's
# *own* code), CI gates only on HIGH severity + HIGH confidence findings
# (see .github/workflows/security.yml and ci.yml). A full lower-severity
# scan is still run and uploaded as an informational artifact. This
# section just scopes what Bandit walks.
exclude_dirs = ["tests", ".git", "build", "dist", ".venv", "venv", "node_modules"]
